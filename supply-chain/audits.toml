version = "0.8.8"
notes = "Phase 5 structural review 2026-09-07: the canonical Rust RNG; here only a build-time dependency of phf_generator (proc-macro codegen), never shipped in the binary. No ambient capabilities beyond the documented std feature; unsafe is confined to invariant-guarded internals: range-validated from_u32_unchecked, bounds-checked get_unchecked, MaybeUninit array initialization, thread-local rng access, a Linux-only pthread_atfork handler, and nightly-only TrustedLen impls excluded on stable"

