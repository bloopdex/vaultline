# Vaultline CI — two jobs on purpose (readability, one run per ref):
#   build-test: the code gates (fmt / clippy / test) on ubuntu + windows
#   verify:     the supply-chain gates (cargo vet / cargo deny) + workflow
#               self-validation, ubuntu only
# The container-harness test (tests/containers.rs) is #[ignore]d and never
# runs here — it is the harness's own existence proof, run manually. The
# container-gated integration suites (PostgreSQL/MySQL/MariaDB round trips,
# MinIO, the sidecar/pause-first volume proofs, the SFTP and named-volume
# proofs) run on the ubuntu job where Docker, the database clients, and the
# OpenSSH client are present; suites skip gracefully when a requirement is
# absent (docs/testing.md).
#
# Trigger map: pushes to master and v* tags run the full gates; pull requests
# run the same gates pre-merge.

name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The integration tests need real binaries: restic (engine), sqlite3
      # (SQLite capture), pg_dump (PostgreSQL capture; the container itself
      # comes from testcontainers on the runner's Docker), the mysql client
      # tools (MySQL round trip), and the OpenSSH client (the SFTP proof's
      # agent). On Windows the tests skip gracefully when a tool is absent
      # (docs/testing.md).
      - name: Install test tools (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y restic sqlite3 postgresql-client mysql-client openssh-client
      # The named-volume direct-capture proof needs the runner user to
      # traverse the docker-data directory (the daemon answers on its
      # socket; the filesystem is root-only by default — the first
      # hosted run recorded the skip). The grant makes the proof
      # EXECUTE here; the proof's reachability gate still skips
      # honestly wherever traversal genuinely cannot work (Docker
      # Desktop VMs).
      - name: Grant docker-data traversal (named-volume proof)
        if: runner.os == 'Linux'
        run: sudo chmod o+rx /var/lib/docker /var/lib/docker/volumes || true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  verify:
    name: supply chain & workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo vet
        run: |
          cargo install cargo-vet --locked
          cargo vet check --store-path supply-chain
      - name: cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Workflow self-validation
        run: python scripts/check-workflows.py
