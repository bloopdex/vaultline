[workspace]
resolver = "3"
members = ["crates/vaultline-core", "crates/vaultline-cli"]
# The fuzz crate needs nightly libFuzzer — kept out of the stable-rust
# workspace (built by the fuzz CI job only).
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Mohammed Rami Benhamida"]
