[package]
name = "vaultline-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The vaultline CLI: application-aware backup & disaster recovery for Linux VPSes"

[[bin]]
name = "vaultline"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
vaultline-core = { path = "../vaultline-core" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql", "mariadb"] }
