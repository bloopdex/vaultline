[package]
name = "vaultline-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The canonical, engine-agnostic application-recovery model (ADR-V0-3) and its typed TOML configuration layer"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
